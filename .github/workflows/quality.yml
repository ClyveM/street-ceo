name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend test dependencies
        if: ${{ hashFiles('services/api/requirements.txt') != '' }}
        run: python -m pip install --requirement services/api/requirements.txt
      - name: Run dependency-light quality checks
        run: python tests/run_checks.py
      - name: Run backend tests
        if: ${{ hashFiles('services/api/test_*.py') != '' }}
        run: python -m pytest services/api
