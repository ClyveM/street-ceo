name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    env:
      STREET_CEO_STORE: memory
      STREET_CEO_SEED_DEMO: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend test dependencies
        if: ${{ hashFiles('services/api/requirements.txt') != '' }}
        run: python -m pip install --requirement services/api/requirements.txt
      - name: Run dependency-light quality checks
        run: python tests/run_checks.py
      - name: Verify source-only checkout manifest
        run: python infra/check_source_manifest.py
      - name: Run service and connected SQLite acceptance tests
        if: ${{ hashFiles('services/api/test_*.py') != '' }}
        run: python -m pytest services tests/sqlite_demo_acceptance.py tests/starter_cogs_acceptance.py tests/muse_outage_acceptance.py tests/fast_counter_acceptance.py tests/quantity_reply_acceptance.py

  shop-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked shop dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Shop contract tests
        working-directory: apps/web
        run: npm run test:frontend
      - name: Build shop from checkout
        working-directory: apps/web
        run: npm run build
      - name: Independent client acceptance
        run: node --experimental-strip-types --test tests/catalogue_voice_client.mjs tests/counter_polish_client.mjs tests/phone_recovery_client.mjs tests/quantity_reply_client.mjs
